services:
  talli:
    build:
      context: .
    image: talli:local
    restart: unless-stopped
    environment:
      DATABASE_PATH: /data/finance.db
    ports:
      - "${PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - talli-data:/data

volumes:
  talli-data:
